---
version: 2
updates:
  # Monitor GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "datf"

  # Monitor Python dependencies in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "datf"

  # Monitor Dockerfile base images in docker/
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "daily"
      time: "06:00"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "datf"
