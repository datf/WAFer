[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer"
version = "0.1.0"
description = "Gemma-Clef System One WAF Decision Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "peft>=0.14.0",
    "accelerate>=1.2.0",
    "pydantic>=2.9.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
]
gpu = [
    "bitsandbytes>=0.45.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wafer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
