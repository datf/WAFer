[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer"
version = "0.1.0"
description = "Gemma-Clef System One WAF Decision Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15.0",
    "transformers>=5.21.0",
    "peft>=0.21.0",
    "accelerate>=1.15.0",
    "pydantic>=2.14.1",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
]
gpu = [
    "bitsandbytes>=0.45.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wafer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
